<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Скуратовские котики</title>
  <meta name="description" content="Фотоальбом: скуратовские котики.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐈‍⬛%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero" id="hero">
    <div class="lamp" aria-hidden="true">
      <span class="cord"></span>
      <span class="socket"></span>
      <span class="glass"></span>
    </div>
    <div class="sleeve">
      <svg class="ears" viewBox="0 0 130 56" aria-hidden="true">
        <path class="fill" d="M8 56 L18 6 L52 56 Z M78 56 L112 6 L122 56 Z"/>
        <path class="line" d="M8 56 L18 6 L52 56 M78 56 L112 6 L122 56"/>
        <path class="line thin" d="M25 47 L21 22 L38 47 M91 47 L109 22 L105 47"/>
      </svg>
      <svg class="sparks" viewBox="0 0 60 40" aria-hidden="true">
        <path d="M6 32 L15 23 M27 15 L29 3 M45 19 L56 10"/>
      </svg>
      <h1><span>скуратовские</span> <span>котики</span></h1>
      <svg class="scribble" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
        <path d="M3 9 C 30 1, 50 15, 80 7 S 140 2, 170 9 S 190 8, 197 5"/>
      </svg>
    </div>
    <span class="cue" aria-hidden="true"></span>
  </header>

  <main class="feed" id="feed" aria-label="Фотографии"></main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" hidden>
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="" draggable="false">
    </div>
    <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="Закрыть">&#10005;</button>
    <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="Предыдущее фото">&#8249;</button>
    <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="Следующее фото">&#8250;</button>
    <div class="lb-count" id="lbCount"></div>
    <div class="lb-hint" id="lbHint"></div>
  </div>

  <noscript><p class="msg">Для просмотра фотографий включите JavaScript.</p></noscript>

  <script src="script.js"></script>
</body>
</html>
